name: Fork release

# Автоверсии форка и релиз с готовым APK (fork-only workflow; оригинал его не затрагивает).
# Версия: <VERSION оригинала>-ru.<N>, N растёт на каждый релиз и сбрасывается, когда после
# синхронизации с оригиналом меняется VERSION. APK собирает android-debug.yml (подпись
# общеизвестным debug-ключом из репозитория, секреты не нужны) и прикладывается к релизу
# файлами .apk, а не архивом. Подробности: docs/fork-versioning.md.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/README.md"
  workflow_dispatch:
    inputs:
      targets:
        description: "Rust Android targets, space separated (aarch64 = most phones)."
        required: false
        default: "aarch64"
        type: string

permissions:
  contents: read

concurrency:
  group: fork-release
  cancel-in-progress: false

jobs:
  version:
    name: Compute fork version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      skip: ${{ steps.v.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Compute version
        id: v
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          base="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: VERSION is not x.y.z: $base" >&2
            exit 1
          fi
          existing="$(git tag --points-at HEAD --list "v${base}-ru.*" | head -n1)"
          if [ -n "$existing" ]; then
            echo "HEAD is already released as $existing"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "version=${existing#v}" >> "$GITHUB_OUTPUT"
            echo "tag=$existing" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last="$(git tag --list "v${base}-ru.*" | sed -E 's/^.*-ru\.//' | sort -n | tail -n1)"
          next=$(( ${last:-0} + 1 ))
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=${base}-ru.${next}" >> "$GITHUB_OUTPUT"
          echo "tag=v${base}-ru.${next}" >> "$GITHUB_OUTPUT"

  apk:
    name: Build debug-signed APK
    needs: version
    if: needs.version.outputs.skip != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/android-debug.yml
    with:
      source_ref: ${{ github.sha }}
      targets: ${{ inputs.targets || 'aarch64' }}
      apk_version: ${{ needs.version.outputs.version }}

  release:
    name: Publish GitHub Release
    needs: [version, apk]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Download APKs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: ratspeak-android-debug-signed
          path: dist

      - name: Create tag and release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          ls -l dist
          test -n "$(ls dist/*.apk 2>/dev/null)"
          git fetch --tags --force
          base="$(tr -d '[:space:]' < VERSION)"
          prev="$(git tag --list 'v*-ru.*' --sort=-creatordate | head -n1 || true)"
          {
            echo "Ratspeak-ru ${VERSION}: форк Ratspeak ${base}."
            echo
            echo "APK подписан общеизвестным debug-ключом из репозитория (\`tools/android/ratspeak-debug-keystore.base64\`) и установится рядом с оригиналом как \`org.ratspeak.android.ru\`. Только для личной установки, не для распространения."
            echo
            echo "Для большинства телефонов нужен файл \`*-arm64*.apk\`. Контрольные суммы: \`checksums.txt\`."
            echo
            echo "### Изменения"
            if [ -n "$prev" ]; then
              git log --no-merges --pretty='- %s (%h)' "${prev}..HEAD" | head -n 60
            else
              git log --no-merges --pretty='- %s (%h)' -n 30
            fi
          } > notes.md
          gh release create "$TAG" dist/*.apk dist/checksums.txt \
            --target "$GITHUB_SHA" \
            --title "Ratspeak-ru ${VERSION}" \
            --notes-file notes.md
